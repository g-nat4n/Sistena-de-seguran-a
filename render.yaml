# Blueprint Render — use no dashboard: New → Blueprint → este repositório
# 1) Deploy este blueprint
# 2) Em smartguard-api, defina CORS_ORIGINS com a URL da Vercel
# 3) Em smartguard-vision, confira SMARTGUARD_API_URL e VISION_SERVICE_TOKEN iguais à API

databases:
  - name: smartguard-db
    plan: free
    databaseName: smartguard
    user: smartguard

services:
  - type: web
    name: smartguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRYPTO_SECRET
        generateValue: true
      - key: VISION_SERVICE_TOKEN
        generateValue: true
      - key: SECURITY_PERMIT_ALL
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: VISION_BASE_URL
        fromService:
          name: smartguard-vision
          type: web
          property: host
      - key: EVIDENCE_DIR
        value: /app/data/evidence

  - type: web
    name: smartguard-vision
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VISION_SERVICE_TOKEN
        sync: false
      - key: SMARTGUARD_API_URL
        sync: false
      - key: VISION_PUBLIC_BASE_URL
        fromService:
          name: smartguard-vision
          type: web
          property: host
      - key: DETECTION_ENABLED
        value: "true"
      - key: PERSON_ALERT_ENABLED
        value: "false"
