# SmartGuard — instalação local no PC (tudo junto)
# Uso: docker compose -f docker-compose.local.yml up -d --build
# App: http://localhost:3080

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartguard
      POSTGRES_USER: smartguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartguard}
    volumes:
      - smartguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartguard -d smartguard"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    container_name: smartguard-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/smartguard
      DB_USERNAME: smartguard
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smartguard}
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      CORS_ORIGINS: http://localhost:3080,http://127.0.0.1:3080
      JWT_SECRET: ${JWT_SECRET:-SmartGuardAiDevSecretKey_ChangeMe_32charsMin!!}
      CRYPTO_SECRET: ${CRYPTO_SECRET:-SmartGuardCryptoDevKey_ChangeInProd_32b}
      VISION_BASE_URL: http://vision:8090
      VISION_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:-smartguard-vision-dev-token}
      EVIDENCE_DIR: /app/data/evidence
      SECURITY_PERMIT_ALL: "false"
    volumes:
      - api_evidence:/app/data/evidence
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  vision:
    build:
      context: ./ai
      args:
        # true = melhor detecção (build bem mais lento/pesado)
        INSTALL_YOLO: ${INSTALL_YOLO:-false}
    container_name: smartguard-vision
    restart: unless-stopped
    environment:
      SMARTGUARD_API_URL: http://api:8080/api
      VISION_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:-smartguard-vision-dev-token}
      VISION_PUBLIC_BASE_URL: http://localhost:8090
      DETECTION_ENABLED: "true"
      PERSON_ALERT_ENABLED: "false"
      EVIDENCE_DIR: /app/data/evidence
    ports:
      - "8090:8090"
    volumes:
      - vision_evidence:/app/data/evidence
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: smartguard-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3080:80"

volumes:
  smartguard_pg_data:
  api_evidence:
  vision_evidence:
