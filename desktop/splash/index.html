<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>SmartGuard AI</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      font-family: Segoe UI, system-ui, sans-serif;
      background: linear-gradient(160deg, #0b1120, #0a1628 60%, #0b1a14);
      color: #f8fafc;
      display: grid; place-items: center;
      user-select: none;
    }
    .card { text-align: center; max-width: 420px; padding: 24px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 16px;
      border-radius: 16px; background: #151e30;
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px #263449;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; }
    p { color: #94a3b8; margin: 10px 0 0; font-size: 14px; line-height: 1.45; }
    .bar {
      margin: 28px auto 0; width: 220px; height: 4px; border-radius: 999px;
      background: #1e293b; overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .err { color: #fca5a5; margin-top: 16px; font-size: 13px; }
    button {
      margin-top: 14px; background: #3b82f6; color: white; border: 0;
      border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 64 64" fill="none">
        <path d="M32 10L50 18V30C50 41 42 50 32 54C22 50 14 41 14 30V18L32 10Z" stroke="#3B82F6" stroke-width="3" fill="#151E30"/>
        <circle cx="32" cy="30" r="8" fill="#22C55E"/>
      </svg>
    </div>
    <h1>SmartGuard AI</h1>
    <p id="status">Verificando serviços locais…</p>
    <div class="bar"><i></i></div>
    <div id="error" class="err" hidden></div>
    <button id="retry" hidden>Tentar novamente</button>
  </div>
  <script>
    const { ipcRenderer } = require('electron')
    const status = document.getElementById('status')
    const error = document.getElementById('error')
    const retry = document.getElementById('retry')
    ipcRenderer.on('splash-status', (_e, msg) => { status.textContent = msg })
    ipcRenderer.on('splash-error', (_e, msg) => {
      error.hidden = false
      retry.hidden = false
      error.textContent = msg
    })
    retry.onclick = () => {
      error.hidden = true
      retry.hidden = true
      ipcRenderer.send('splash-retry')
    }
  </script>
</body>
</html>
