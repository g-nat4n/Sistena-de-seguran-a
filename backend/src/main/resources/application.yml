spring:
  application:
    name: smartguard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/smartguard}
    username: ${DB_USERNAME:smartguard}
    password: ${DB_PASSWORD:smartguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

smartguard:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    permit-all: ${SECURITY_PERMIT_ALL:false}
  jwt:
    secret: ${JWT_SECRET:SmartGuardAiDevSecretKey_ChangeMe_32charsMin!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.smartguard: INFO
